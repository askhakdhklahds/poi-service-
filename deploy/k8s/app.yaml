apiVersion: v1
kind: ConfigMap
metadata:
  name: poi-service-config
data:
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poi
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  APP_IMPORT_MODE: kafka
  GEOSERVER_URL: http://geoserver:8080/geoserver
---
apiVersion: v1
kind: Secret
metadata:
  name: poi-service-secret
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
  AUTH_JWT_SECRET: change-me-in-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poi-service
  labels:
    app: poi-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: poi-service
  template:
    metadata:
      labels:
        app: poi-service
    spec:
      containers:
        - name: poi-service
          image: poi-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: poi-service-config
            - secretRef:
                name: poi-service-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: poi-service
spec:
  selector:
    app: poi-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poi-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poi-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poi-service
spec:
  ingressClassName: nginx
  rules:
    - host: poi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poi-service
                port:
                  number: 8081
