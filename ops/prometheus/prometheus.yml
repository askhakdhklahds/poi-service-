global:
  scrape_interval: 15s

scrape_configs:
  - job_name: poi-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  - job_name: poi-service-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
