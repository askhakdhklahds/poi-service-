services:
  postgres:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poi
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poi"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  geoserver:
    image: kartoza/geoserver:2.26.2
    environment:
      GEOSERVER_ADMIN_PASSWORD: geoserver
    ports: ["8083:8080"]

  app:
    build: .
    ports: ["8082:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poi
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GEOSERVER_URL: http://geoserver:8080/geoserver
      TILES_DIR: /app/tiles
      TILES_GCJ_DIR: /app/tiles-gcj
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-poi-service-demo-secret-key-change-in-production-2026}
      TILES_PUBLIC_BASE_URL: ${TILES_PUBLIC_BASE_URL:-}
      TILES_PUBLIC_GCJ_BASE_URL: ${TILES_PUBLIC_GCJ_BASE_URL:-}
    volumes:
      - ./tiles:/app/tiles:ro
      - ./tiles-gcj:/app/tiles-gcj:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      geoserver:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [app]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
