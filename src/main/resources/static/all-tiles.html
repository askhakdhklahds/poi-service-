<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>城市 POI 空间分析 · 高德底图</title>
  <link rel="icon" href="data:," />
  <link href="/vendor/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      width: 280px; max-height: 86vh; overflow: auto;
      background: rgba(255,255,255,.97); padding: 12px 14px; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }
    #panel h3 { margin: 0 0 6px; font-size: 15px; }
    #summary { color: #334155; margin-bottom: 8px; }
    .cat-item {
      display: flex; align-items: center; gap: 6px;
      padding: 2px 0; cursor: pointer;
    }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #334155; cursor: pointer; }
    .switch input { width: 16px; height: 16px; accent-color: #2563eb; }
    .cat-item .count { margin-left: auto; color: #64748b; font-size: 12px; }
    .legend-icon { width: 18px; height: 18px; }
    .row { margin-top: 8px; }
    select { width: 100%; padding: 4px; }
    button { padding: 4px 10px; margin-right: 4px; cursor: pointer; }
    .hint { color: #888; font-size: 12px; margin-top: 8px; }
    a { color: #2563eb; }
    #detail {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      width: 310px; background: rgba(255,255,255,.98); padding: 14px;
      border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    #detail.hidden { display: none; }
    #detail .close {
      position: absolute; top: 8px; right: 10px;
      border: 0; background: transparent; font-size: 20px; line-height: 1;
      padding: 0; cursor: pointer; color: #64748b;
    }
    #detail h3 { margin: 0 24px 6px 0; font-size: 16px; }
    .badge {
      display: inline-block; color: #fff; padding: 1px 8px;
      border-radius: 10px; font-size: 12px; margin-bottom: 8px;
    }
    #detail dl { display: grid; grid-template-columns: 70px 1fr; gap: 4px 8px; margin: 8px 0; }
    #detail dt { color: #64748b; }
    #detail dd { margin: 0; word-break: break-all; }
    #loading {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: rgba(15,23,42,.85); color: #fff;
      padding: 5px 12px; border-radius: 16px; display: none;
      font-size: 12px;
    }

    /* ---- polished UI ---- */
    #panel {
      width: 292px; padding: 14px; border-radius: 16px;
      background: rgba(255,255,255,.9); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.75);
      box-shadow: 0 16px 48px rgba(15,23,42,.16);
    }
    .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff; display: grid; place-items: center;
      font-weight: 800; font-size: 18px;
      box-shadow: 0 6px 16px rgba(37,99,235,.28);
    }
    #panel h3 { margin: 0; font-size: 15px; }
    #panel .sub { color: #64748b; font-size: 11px; margin-top: -1px; }
    #summary {
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      border: 1px solid #dbeafe; border-radius: 13px;
      padding: 10px 12px; margin: 0 0 10px;
    }
    #summary .total { font-size: 24px; font-weight: 800; color: #1d4ed8; line-height: 1.1; }
    #summary .total-label { color: #64748b; font-size: 12px; }
    .cat-item { padding: 5px 6px; border-radius: 9px; transition: .15s; }
    .cat-item:hover { background: #f1f5f9; }
    .cat-item input { accent-color: #2563eb; }
    .cat-item .count {
      background: #f1f5f9; border-radius: 999px;
      padding: 1px 7px; font-size: 11px;
    }
    #panel select {
      width: 100%; border: 1px solid #dbe3ee; border-radius: 9px;
      padding: 6px 8px; background: #fff; font: inherit;
      font-size: 13px; color: #334155;
    }
    #panel button {
      border: 1px solid #dbe3ee; background: #fff; border-radius: 9px;
      padding: 6px 10px; font-size: 12px; color: #334155; transition: .15s;
    }
    #panel button:hover {
      border-color: #93c5fd; background: #eff6ff; color: #1d4ed8;
      transform: translateY(-1px);
    }
    #detail {
      border-radius: 16px; background: rgba(255,255,255,.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.75);
      box-shadow: 0 18px 52px rgba(15,23,42,.2);
    }
    #detail h3 { font-size: 18px; }
    #detail .badge {
      padding: 2px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
    }
    #detail dt { color: #94a3b8; font-size: 12px; }
    #detail dd { color: #334155; }
    #loading { display: none; align-items: center; gap: 6px; }
    #loading::before {
      content: ""; width: 10px; height: 10px;
      border: 2px solid #fff; border-top-color: transparent;
      border-radius: 50%; animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 720px) {
      #panel { width: calc(100vw - 24px); max-height: 46vh; }
      #detail { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; }
    }
  </style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div class="brand-row">
    <div class="brand-logo">G</div>
    <div>
      <h3>城市 POI 空间分析</h3>
      <div class="sub">GeoAgent · 高德 GCJ-02</div>
    </div>
  </div>
  <div id="summary">加载统计…</div>
  <div class="row toggle-row">
    <label class="switch"><input type="checkbox" id="toggle-poi" checked /> 显示 POI</label>
  </div>
  <div id="filters"></div>
  <div class="row">
    <select id="subcat">
      <option value="">全部小类</option>
    </select>
  </div>
  <div class="row">
    <button onclick="setBasemap('street')">高德街道</button>
    <button onclick="setBasemap('satellite')">高德卫星</button>
  </div>
  <div class="row">
    <button onclick="selectAll(true)">全选</button>
    <button onclick="selectAll(false)">全不选</button>
  </div>
  <div class="hint">高德 GCJ-02 底图 · 85,864 个真实 POI · 纠偏瓦片</div>
  <div class="hint">
    <a href="/agent.html">AI 助手</a> · <a href="/">周边查询</a> ·
    <a href="/points.html">GeoJSON 点</a> · <a href="/mvt.html">动态 MVT</a> ·
    <a href="/login.html">登录</a>
  </div>
</div>

<div id="detail" class="hidden">
  <button class="close" onclick="hideDetail()">×</button>
  <h3 id="d-name">—</h3>
  <div id="d-cat" class="badge">—</div>
  <dl>
    <dt>小类</dt><dd id="d-sub">—</dd>
    <dt>经纬度</dt><dd id="d-lnglat">—</dd>
    <dt>所属区</dt><dd id="d-district">—</dd>
    <dt>来源</dt><dd id="d-source">—</dd>
    <dt>ID</dt><dd id="d-id">—</dd>
    <dt>入库时间</dt><dd id="d-time">—</dd>
  </dl>
  <div id="d-actions"></div>
  <div class="hint">坐标以 WGS84 存储，底图为高德 GCJ-02，展示已纠偏</div>
</div>

<div id="loading">加载中…</div>

<script src="/vendor/maplibre-gl.js"></script>
<script>
const ORIGIN = window.location.origin;
const GCJ_CENTER = [121.478223, 31.228458];

const COLORS = {
  '餐饮': '#ef4444', '购物': '#f59e0b', '医院': '#dc2626',
  '学校': '#8b5cf6', '交通': '#2563eb', '景点': '#10b981',
  '商业': '#ec4899', '其他': '#64748b'
};
const ICON_BY_CAT = {
  '餐饮': 'food', '购物': 'shop', '医院': 'hospital',
  '学校': 'school', '交通': 'transport', '景点': 'attraction',
  '商业': 'business', '其他': 'other'
};

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      amapStreet: {
        type: 'raster',
        tiles: [
          'https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
          'https://webrd02.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
          'https://webrd03.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
          'https://webrd04.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}'
        ],
        tileSize: 256,
        maxzoom: 18,
        attribution: '&copy; 高德地图'
      },
      amapSatellite: {
        type: 'raster',
        tiles: [
          'https://webst01.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
          'https://webst02.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
          'https://webst03.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
          'https://webst04.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}'
        ],
        tileSize: 256,
        maxzoom: 18,
        attribution: '&copy; 高德地图'
      },
      poi: {
        type: 'vector',
        tiles: [ORIGIN + '/tiles-gcj/{z}/{x}/{y}.pbf'],
        minzoom: 9,
        maxzoom: 13
      }
    },
    layers: [
      { id: 'amap-street', type: 'raster', source: 'amapStreet' },
      { id: 'amap-satellite', type: 'raster', source: 'amapSatellite', layout: { visibility: 'none' } },
      {
        id: 'poi-circles',
        type: 'circle',
        source: 'poi',
        'source-layer': 'poi',
        maxzoom: 12.99,
        paint: {
          'circle-radius': [
            'interpolate', ['linear'], ['zoom'],
            9, ['min', ['*', ['sqrt', ['coalesce', ['get', 'cnt'], 1]], 1.4], 10],
            12, ['min', ['*', ['sqrt', ['coalesce', ['get', 'cnt'], 1]], 2.0], 10]
          ],
          'circle-color': [
            'match', ['get', 'category'],
            '餐饮', COLORS['餐饮'],
            '购物', COLORS['购物'],
            '医院', COLORS['医院'],
            '学校', COLORS['学校'],
            '交通', COLORS['交通'],
            '景点', COLORS['景点'],
            '商业', COLORS['商业'],
            COLORS['其他']
          ],
          'circle-opacity': 0.75
        }
      }
    ]
  },
  center: GCJ_CENTER,
  zoom: 13,
  maxZoom: 18
});

map.dragRotate.disable();
map.touchZoomRotate.disableRotation();
map.setRenderWorldCopies(false);

map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-right');

map.on('movestart', () => { document.getElementById('loading').style.display = 'flex'; });
map.on('idle', () => { document.getElementById('loading').style.display = 'none'; });

map.on('load', async () => {
  fetch(ORIGIN + '/api/config')
    .then(r => r.json())
    .then(cfg => {
      const base = cfg.data && cfg.data.gcjTileBaseUrl;
      if (!base) return;
      const source = map.getSource('poi');
      if (source && typeof source.setTiles === 'function') {
        source.setTiles([base + '/{z}/{x}/{y}.pbf']);
      }
    })
    .catch(() => {});

  try {
    const geo = await (await fetch(ORIGIN + '/districts_gcj.json')).json();
    map.addSource('districts', { type: 'geojson', data: geo });
    map.addLayer({
      id: 'district-fill', type: 'fill', source: 'districts',
      paint: { 'fill-color': '#93c5fd', 'fill-opacity': 0.04 }
    });
    map.addLayer({
      id: 'district-line', type: 'line', source: 'districts',
      paint: { 'line-color': '#1d4ed8', 'line-width': 1.2, 'line-opacity': 0.8 }
    });
  } catch (e) {
    console.warn('district boundaries failed', e);
  }

  bindPoiEvents('poi-circles');

  try {
    await loadIcons();
    map.addLayer({
      id: 'poi-icons',
      type: 'symbol',
      source: 'poi',
      'source-layer': 'poi',
      minzoom: 13,
      layout: {
        'icon-image': [
          'match', ['get', 'category'],
          '餐饮', 'icon-food',
          '购物', 'icon-shop',
          '医院', 'icon-hospital',
          '学校', 'icon-school',
          '交通', 'icon-transport',
          '景点', 'icon-attraction',
          '商业', 'icon-business',
          'icon-other'
        ],
        'icon-size': ['interpolate', ['linear'], ['zoom'], 13, 0.42, 16, 0.75],
        'icon-allow-overlap': true,
        'icon-ignore-placement': true
      }
    });
    bindPoiEvents('poi-icons');
  } catch (e) {
    console.warn('icons failed', e);
    map.addLayer({
      id: 'poi-fallback',
      type: 'circle',
      source: 'poi',
      'source-layer': 'poi',
      minzoom: 13,
      paint: {
        'circle-radius': 3.5,
        'circle-color': '#2563eb',
        'circle-opacity': 0.8
      }
    });
    bindPoiEvents('poi-fallback');
  }
  applyPoiVisibility();
});

loadStats();

function bindPoiEvents(layerId) {
  map.on('click', layerId, (e) => {
    const p = e.features[0].properties;
    if (p.id !== undefined && p.id !== null && p.id !== '') {
      showPoiDetail(p.id, e.lngLat);
    } else {
      showAggregateDetail(p, e.lngLat);
    }
  });
  map.on('mouseenter', layerId, () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', layerId, () => { map.getCanvas().style.cursor = ''; });
}

async function loadIcons() {
  const files = ['food', 'shop', 'hospital', 'school', 'transport', 'attraction', 'business', 'other'];
  await Promise.all(files.map(async (file) => {
    const resp = await fetch(`${ORIGIN}/icons/${file}.png`);
    const blob = await resp.blob();
    const bitmap = await createImageBitmap(blob);
    if (!map.hasImage(`icon-${file}`)) {
      map.addImage(`icon-${file}`, bitmap);
    }
  }));
}

async function loadStats() {
  try {
    const json = await (await fetch(ORIGIN + '/api/poi/stats')).json();
    const data = json.data;
    document.getElementById('summary').innerHTML =
      `<div class="total">${Number(data.total).toLocaleString()}</div>
       <div class="total-label">个真实 POI</div>`;

    const filters = document.getElementById('filters');
    filters.innerHTML = '';
    for (const row of data.categories) {
      const file = ICON_BY_CAT[row.category] || 'other';
      const label = document.createElement('label');
      label.className = 'cat-item';
      label.innerHTML = `
        <input type="checkbox" class="cat-check" value="${row.category}" checked>
        <img class="legend-icon" src="${ORIGIN}/icons/${file}.png" alt="">
        <span>${row.category}</span>
        <span class="count">${row.cnt}</span>`;
      filters.appendChild(label);
    }
    filters.querySelectorAll('input').forEach(el => {
      el.addEventListener('change', applyFilter);
    });

    const subcat = document.getElementById('subcat');
    const groups = {};
    for (const row of data.subCategories) {
      (groups[row.category] = groups[row.category] || []).push(row);
    }
    for (const [cat, rows] of Object.entries(groups)) {
      const group = document.createElement('optgroup');
      group.label = cat;
      for (const row of rows) {
        const opt = document.createElement('option');
        opt.value = row.category + '||' + row.sub_category;
        opt.textContent = `${row.sub_category} (${row.cnt})`;
        group.appendChild(opt);
      }
      subcat.appendChild(group);
    }
    subcat.addEventListener('change', applyFilter);
  } catch (e) {
    document.getElementById('summary').textContent = '统计加载失败';
  }
}

function applyFilter() {
  const subVal = document.getElementById('subcat').value;
  let expr = null;
  if (subVal) {
    const sub = subVal.split('||')[1];
    expr = ['==', ['get', 'sub_category'], sub];
  } else {
    const checks = [...document.querySelectorAll('.cat-check')];
    const selected = checks.filter(c => c.checked).map(c => c.value);
    if (selected.length === 0) {
      expr = ['==', ['get', 'category'], '__none__'];
    } else if (selected.length < checks.length) {
      expr = ['in', ['get', 'category'], ['literal', selected]];
    }
  }
  ['poi-circles', 'poi-icons', 'poi-fallback'].forEach(id => {
    if (map.getLayer(id)) {
      map.setFilter(id, expr);
    }
  });
}

let poiVisible = true;

function applyPoiVisibility() {
  const visibility = poiVisible ? 'visible' : 'none';
  ['poi-circles', 'poi-icons', 'poi-fallback'].forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visibility);
  });
}

document.getElementById('toggle-poi').addEventListener('change', (event) => {
  poiVisible = event.target.checked;
  applyPoiVisibility();
});

function selectAll(checked) {
  document.querySelectorAll('.cat-check').forEach(c => { c.checked = checked; });
  document.getElementById('subcat').value = '';
  applyFilter();
}

function setBasemap(type) {
  map.setLayoutProperty('amap-street', 'visibility', type === 'street' ? 'visible' : 'none');
  map.setLayoutProperty('amap-satellite', 'visibility', type === 'satellite' ? 'visible' : 'none');
}

async function showPoiDetail(id, lngLat) {
  try {
    const res = await fetch(`${ORIGIN}/api/poi/${id}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const d = json.data;

    document.getElementById('d-name').textContent = d.name || '未命名';
    const badge = document.getElementById('d-cat');
    badge.textContent = d.category || '—';
    badge.style.background = COLORS[d.category] || COLORS['其他'];
    document.getElementById('d-sub').textContent = d.sub_category || '—';
    document.getElementById('d-lnglat').textContent =
      `${Number(d.lng).toFixed(6)}, ${Number(d.lat).toFixed(6)}`;
    document.getElementById('d-district').textContent = d.district_name || '—';
    document.getElementById('d-source').textContent = d.source_id || '—';
    document.getElementById('d-id').textContent = d.id;
    document.getElementById('d-time').textContent = d.created_at || '—';
    document.getElementById('d-actions').innerHTML =
      `<button onclick="flyTo(${lngLat.lng},${lngLat.lat})">定位</button>`;

    document.getElementById('detail').classList.remove('hidden');
  } catch (e) {
    showAggregateDetail({ cnt: '?', category: '未知', sub_category: '—' }, lngLat);
  }
}

function showAggregateDetail(p, lngLat) {
  document.getElementById('d-name').textContent = `聚合点（${p.cnt || '多个'} 个）`;
  const badge = document.getElementById('d-cat');
  badge.textContent = p.category || '聚合';
  badge.style.background = COLORS[p.category] || COLORS['其他'];
  document.getElementById('d-sub').textContent = p.sub_category || '多个小类';
  document.getElementById('d-lnglat').textContent = '放大地图查看具体 POI';
  document.getElementById('d-district').textContent = '—';
  document.getElementById('d-source').textContent = 'OSM 聚合';
  document.getElementById('d-id').textContent = '—';
  document.getElementById('d-time').textContent = '—';
  document.getElementById('d-actions').innerHTML =
    `<button onclick="map.easeTo({center:[${lngLat.lng},${lngLat.lat}],zoom:map.getZoom()+2})">放大查看</button>`;
  document.getElementById('detail').classList.remove('hidden');
}

function flyTo(lon, lat) {
  map.flyTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 15) });
}

function hideDetail() {
  document.getElementById('detail').classList.add('hidden');
}
</script>
</body>
</html>
