<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 分钟生活圈评估 · POI 空间分析平台</title>
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    :root {
      --blue: #2563eb;
      --slate: #64748b;
      --green: #16a34a;
      --red: #dc2626;
      --panel: rgba(255, 255, 255, 0.94);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      color: #0f172a;
      background: #e2e8f0;
    }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 340px;
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 18px;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(16px);
      z-index: 10;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--blue);
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 { margin: 6px 0 4px; font-size: 22px; line-height: 1.25; }
    .sub { margin: 0 0 16px; color: var(--slate); font-size: 13px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 13px; }
    select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font: inherit;
      color: #0f172a;
    }
    button {
      margin-top: 16px;
      border: 0;
      background: linear-gradient(135deg, var(--blue), #7c3aed);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { margin-top: 10px; min-height: 20px; color: var(--slate); font-size: 12px; }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .metric {
      padding: 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .metric .label { color: var(--slate); font-size: 12px; }
    .metric .value { font-size: 20px; font-weight: 800; margin-top: 2px; }
    .metric .value.green { color: var(--green); }
    .metric .value.red { color: var(--red); }
    .legend {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      color: var(--slate);
      font-size: 12px;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .note {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      color: var(--slate);
      font-size: 11px;
      line-height: 1.7;
    }
    .note a { color: var(--blue); text-decoration: none; }
    .maplibregl-popup-content {
      font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      border-radius: 10px;
      padding: 12px 14px;
    }
    @media (max-width: 720px) {
      .panel { left: 10px; right: 10px; top: 10px; width: auto; max-height: 46vh; }
    }
  </style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <div class="eyebrow">Life Circle</div>
  <h1>15 分钟生活圈评估</h1>
  <p class="sub">按街区人口估算步行可达覆盖率，找出服务盲区。</p>

  <label for="district">行政区</label>
  <select id="district"></select>

  <label for="category">设施类型</label>
  <select id="category"></select>

  <label for="threshold">步行时间</label>
  <select id="threshold">
    <option value="300">5 分钟</option>
    <option value="600">10 分钟</option>
    <option value="900" selected>15 分钟</option>
  </select>

  <button id="run">开始评估</button>
  <div class="status" id="status">正在加载行政区与设施类型…</div>

  <div class="summary">
    <div class="metric">
      <div class="label">覆盖人口</div>
      <div class="value green" id="pop-covered">—</div>
    </div>
    <div class="metric">
      <div class="label">覆盖率</div>
      <div class="value green" id="coverage-ratio">—</div>
    </div>
    <div class="metric">
      <div class="label">盲区人口</div>
      <div class="value red" id="gap-pop">—</div>
    </div>
    <div class="metric">
      <div class="label">分析网格</div>
      <div class="value" id="cell-count">—</div>
    </div>
  </div>

  <div class="legend">
    <span><i class="swatch" style="background:#22c55e"></i>已覆盖</span>
    <span><i class="swatch" style="background:#ef4444"></i>服务盲区</span>
  </div>

  <div class="note">
    人口：WorldPop 2020（CC-BY-4.0）<br />
    POI / 路网：OpenStreetMap（ODbL）<br />
    覆盖按 1.2 m/s 步行速度折算半径，是评估口径，不是实际路径规划。
    <br /><a href="/">返回周边查询</a> · <a href="/agent.html">GeoAgent</a>
  </div>
</div>

<script src="/vendor/maplibre-gl.js"></script>
<script>
  const center = [121.4737, 31.2304];
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        esri: {
          type: 'raster',
          tiles: [
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
          ],
          tileSize: 256,
          maxzoom: 18,
          attribution: '© Esri'
        }
      },
      layers: [{ id: 'esri', type: 'raster', source: 'esri' }]
    },
    center,
    zoom: 11,
    maxZoom: 18
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

  const districtSelect = document.getElementById('district');
  const categorySelect = document.getElementById('category');
  const thresholdSelect = document.getElementById('threshold');
  const runButton = document.getElementById('run');
  const status = document.getElementById('status');
  const popCovered = document.getElementById('pop-covered');
  const coverageRatio = document.getElementById('coverage-ratio');
  const gapPop = document.getElementById('gap-pop');
  const cellCount = document.getElementById('cell-count');

  let gridSourceReady = false;

  function setStatus(text) { status.textContent = text; }

  async function loadOptions() {
    try {
      const [districts, categories] = await Promise.all([
        fetch('/api/district/list').then(r => r.json()),
        fetch('/api/life-circle/categories').then(r => r.json())
      ]);

      districtSelect.innerHTML = '';
      for (const item of (districts.data || [])) {
        const option = document.createElement('option');
        option.value = item.adcode;
        option.textContent = item.name;
        if (item.adcode === '310101') option.selected = true;
        districtSelect.appendChild(option);
      }

      categorySelect.innerHTML = '';
      for (const item of (categories.data || [])) {
        const option = document.createElement('option');
        option.value = item.code;
        option.textContent = item.name_zh;
        categorySelect.appendChild(option);
      }

      const params = new URLSearchParams(location.search);
      if (params.get('adcode')) districtSelect.value = params.get('adcode');
      if (params.get('category')) categorySelect.value = params.get('category');
      if (params.get('threshold')) thresholdSelect.value = params.get('threshold');

      setStatus('选择行政区、设施类型和步行时间，然后开始评估。');
      if (params.get('adcode') && params.get('category')) {
        runCoverage();
      }
    } catch (e) {
      setStatus('加载选项失败：' + e.message);
    }
  }

  function formatNumber(value) {
    return Number(value || 0).toLocaleString('zh-CN');
  }

  function renderSummary(data) {
    popCovered.textContent = formatNumber(data.popCovered);
    coverageRatio.textContent = (Number(data.coverageRatio || 0) * 100).toFixed(1) + '%';
    gapPop.textContent = formatNumber(data.gapPopulation);
    cellCount.textContent = formatNumber(data.cellCount);
    setStatus(`${data.districtName} · ${data.categoryName} · ${data.radiusM} 米覆盖半径`);
  }

  function ensureGridLayers(geojson) {
    if (!gridSourceReady) {
      map.addSource('life-grid', { type: 'geojson', data: geojson });
      map.addLayer({
        id: 'life-grid-fill',
        type: 'fill',
        source: 'life-grid',
        paint: {
          'fill-color': ['case', ['get', 'covered'], '#22c55e', '#ef4444'],
          'fill-opacity': 0.58
        }
      });
      map.addLayer({
        id: 'life-grid-line',
        type: 'line',
        source: 'life-grid',
        paint: {
          'line-color': ['case', ['get', 'covered'], '#15803d', '#b91c1c'],
          'line-width': 1.0,
          'line-opacity': 0.7
        }
      });
      map.on('click', 'life-grid-fill', (event) => {
        const feature = event.features && event.features[0];
        if (!feature) return;
        const p = feature.properties || {};
        const nearest = p.nearestM == null ? '—' : Number(p.nearestM).toFixed(0) + ' 米';
        new maplibregl.Popup({ closeButton: true })
          .setLngLat(event.lngLat)
          .setHTML(
            `<strong>人口 ${formatNumber(p.pop)}</strong><br/>` +
            `状态：${p.covered ? '已覆盖' : '服务盲区'}<br/>` +
            `最近设施：${nearest}`
          )
          .addTo(map);
      });
      map.on('mouseenter', 'life-grid-fill', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'life-grid-fill', () => {
        map.getCanvas().style.cursor = '';
      });
      gridSourceReady = true;
    } else {
      map.getSource('life-grid').setData(geojson);
    }
  }

  function collectCoords(geometry, out) {
    if (!geometry || !geometry.coordinates) return;
    const walk = (node) => {
      if (!Array.isArray(node)) return;
      if (node.length >= 2 && typeof node[0] === 'number' && typeof node[1] === 'number') {
        out.push([node[0], node[1]]);
      } else {
        node.forEach(walk);
      }
    };
    walk(geometry.coordinates);
  }

  function fitToGeoJson(geojson) {
    const coords = [];
    for (const feature of (geojson.features || [])) {
      collectCoords(feature.geometry, coords);
    }
    if (!coords.length) return;
    const bounds = new maplibregl.LngLatBounds(coords[0], coords[0]);
    for (const coord of coords) bounds.extend(coord);
    map.fitBounds(bounds, {
      padding: { top: 60, bottom: 60, left: 380, right: 60 },
      maxZoom: 14,
      duration: 700
    });
  }

  async function runCoverage() {
    const adcode = districtSelect.value;
    const category = categorySelect.value;
    const threshold = thresholdSelect.value;
    if (!adcode || !category) {
      setStatus('请先选择行政区和设施类型。');
      return;
    }
    runButton.disabled = true;
    setStatus('正在计算覆盖人口…');
    try {
      const url = `/api/life-circle/coverage?adcode=${encodeURIComponent(adcode)}` +
        `&category=${encodeURIComponent(category)}&threshold=${encodeURIComponent(threshold)}`;
      const response = await fetch(url);
      const json = await response.json();
      if (!response.ok || json.code !== 0) {
        throw new Error(json.message || '请求失败');
      }
      const data = json.data;
      renderSummary(data);
      ensureGridLayers(data.geojson);
      fitToGeoJson(data.geojson);
    } catch (e) {
      setStatus('评估失败：' + e.message);
    } finally {
      runButton.disabled = false;
    }
  }

  runButton.addEventListener('click', runCoverage);
  map.on('load', loadOptions);
</script>
</body>
</html>
