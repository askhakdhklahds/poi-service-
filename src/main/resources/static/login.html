<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · POI 平台</title>
  <style>
    body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f1f5f9; }
    .box { max-width: 360px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h2 { margin: 0 0 16px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 10px; }
    button { width: 100%; padding: 9px; cursor: pointer; }
    pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 8px; overflow: auto; max-height: 220px; font-size: 12px; }
    .hint { color: #64748b; font-size: 12px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
<div class="box">
  <h2>登录</h2>
  <input id="u" value="admin" placeholder="用户名" />
  <input id="p" type="password" value="admin123" placeholder="密码" />
  <button onclick="login()">登录</button>
  <pre id="out">未登录</pre>
  <div class="hint">
    admin/admin123（管理员）· analyst/analyst123 · viewer/viewer123<br/>
    <a href="/all-tiles.html">返回地图</a>
  </div>
</div>
<script>
async function login() {
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('u').value,
      password: document.getElementById('p').value
    })
  });
  const json = await res.json();
  if (json.data && json.data.token) {
    localStorage.setItem('token', json.data.token);
  }
  document.getElementById('out').textContent = JSON.stringify(json, null, 2);
}
</script>
</body>
</html>
