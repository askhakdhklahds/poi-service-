<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多路线对比 · POI 空间分析平台</title>
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    :root {
      --blue: #2563eb;
      --slate: #64748b;
      --panel: rgba(255, 255, 255, 0.95);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      color: #0f172a;
      background: #e2e8f0;
    }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 380px;
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 18px;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(16px);
      z-index: 10;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--blue);
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 { margin: 6px 0 4px; font-size: 22px; line-height: 1.25; }
    .sub { margin: 0 0 14px; color: var(--slate); font-size: 13px; }
    .point-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 13px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: 0 0 12px;
      margin-top: 6px;
    }
    .dot.start { background: #16a34a; }
    .dot.end { background: #dc2626; }
    .point-row span { color: var(--slate); }
    .point-row strong { font-weight: 600; }
    .point-field { position: relative; flex: 1; min-width: 0; }
    .point-input {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      font: inherit;
      font-weight: 600;
      color: #0f172a;
      outline: none;
    }
    .point-input::placeholder { color: #94a3b8; font-weight: 400; }
    .point-input:focus {
      background: #fff;
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .point-coord {
      display: block;
      padding: 0 6px;
      color: var(--slate);
      font-size: 11px;
      line-height: 1.5;
    }
    .suggest {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 40;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.18);
      overflow: hidden;
    }
    .suggest.show { display: block; }
    .suggest-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .suggest-item:hover { background: #eff6ff; }
    .suggest-item b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggest-item span { color: #94a3b8; font-size: 11px; white-space: nowrap; }
    .suggest-empty { padding: 10px; color: #94a3b8; font-size: 12px; }
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 12px 0;
      font-size: 13px;
    }
    .row label { display: inline-flex; align-items: center; gap: 6px; }
    select {
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font: inherit;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #plan {
      margin-top: 6px;
      background: linear-gradient(135deg, var(--blue), #7c3aed);
      color: #fff;
    }
    #reset {
      margin-top: 2px;
      background: #e2e8f0;
      color: #334155;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { margin-top: 10px; min-height: 20px; color: var(--slate); font-size: 12px; }
    .route-list { margin-top: 12px; display: grid; gap: 10px; }
    .route-card {
      padding: 12px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .route-card:hover { border-color: #93c5fd; }
    .route-card.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .route-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .route-dot { width: 12px; height: 12px; border-radius: 50%; }
    .route-title { font-weight: 700; }
    .route-mode {
      margin-left: auto;
      font-size: 11px;
      color: var(--slate);
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .route-stats { color: #334155; font-size: 13px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      font-size: 11px;
      color: #334155;
      background: #f1f5f9;
      border-radius: 999px;
      padding: 2px 8px;
    }
    .summary {
      margin-top: 8px;
      color: var(--slate);
      font-size: 12px;
      line-height: 1.65;
    }
    .note {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      color: var(--slate);
      font-size: 11px;
      line-height: 1.7;
    }
    .note a { color: var(--blue); text-decoration: none; }
    .route-summary {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 13px;
    }
    .route-summary.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .route-summary b { color: #0f172a; }
    .route-summary span { color: #64748b; font-size: 12px; }
    .route-marker {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(15,23,42,.2);
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
    }
    .route-marker i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .maplibregl-popup-content {
      font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      border-radius: 10px;
      padding: 10px 12px;
    }
    @media (max-width: 760px) {
      .panel { left: 10px; right: 10px; top: 10px; width: auto; max-height: 50vh; }
    }
  </style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <div class="eyebrow">Route Compare</div>
  <h1>多路线对比</h1>
  <p class="sub">输入地名自动定位，或点击地图选点，查看驾车/步行多路线与沿途特点。</p>

  <div class="point-row"><i class="dot start"></i>
    <div class="point-field">
      <input class="point-input" id="from-input" placeholder="输入起点地名，如 人民广场" autocomplete="off" />
      <span class="point-coord" id="from-text">未选择，可输入地名或点击地图</span>
      <div class="suggest" id="from-suggest"></div>
    </div>
  </div>
  <div class="point-row"><i class="dot end"></i>
    <div class="point-field">
      <input class="point-input" id="to-input" placeholder="输入终点地名，如 外滩" autocomplete="off" />
      <span class="point-coord" id="to-text">未选择，可输入地名或点击地图</span>
      <div class="suggest" id="to-suggest"></div>
    </div>
  </div>

  <div class="row">
    <label><input type="checkbox" id="mode-car" checked /> 驾车</label>
    <label><input type="checkbox" id="mode-walk" checked /> 步行</label>
    <label>备选
      <select id="alternatives">
        <option value="1">1 条</option>
        <option value="2">2 条</option>
        <option value="3" selected>3 条</option>
      </select>
    </label>
  </div>

  <button id="plan">规划路线</button>
  <button id="reset">重新选点</button>
  <div class="status" id="status">输入起点/终点地名并选择建议，或在地图上点两下。</div>
  <div class="route-summary" id="route-summary"></div>

  <div class="route-list" id="route-list"></div>

  <div class="note">
    时间为估算值，未考虑实时路况、红绿灯和转向限制。<br />
    路网：OpenStreetMap（ODbL） · 底图：Esri<br />
    <a href="/">周边查询</a> · <a href="/life-circle.html">生活圈</a> · <a href="/agent.html">GeoAgent</a>
  </div>
</div>

<script src="/vendor/maplibre-gl.js"></script>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        esri: {
          type: 'raster',
          tiles: [
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
          ],
          tileSize: 256,
          maxzoom: 18,
          attribution: '© Esri'
        }
      },
      layers: [{ id: 'esri', type: 'raster', source: 'esri' }]
    },
    center: [121.4900, 31.2400],
    zoom: 12,
    maxZoom: 18
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

  const COLORS = {
    car: ['#ef4444', '#f97316', '#eab308'],
    walk: ['#22c55e', '#06b6d4', '#8b5cf6']
  };

  const fromText = document.getElementById('from-text');
  const toText = document.getElementById('to-text');
  const fromInput = document.getElementById('from-input');
  const toInput = document.getElementById('to-input');
  const fromSuggest = document.getElementById('from-suggest');
  const toSuggest = document.getElementById('to-suggest');
  const status = document.getElementById('status');
  const routeList = document.getElementById('route-list');
  const planButton = document.getElementById('plan');
  const resetButton = document.getElementById('reset');

  let from = null;
  let to = null;
  let fromMarker = null;
  let toMarker = null;
  let currentRoutes = [];
  let routeLayerIds = [];
  let selectedIndex = -1;
  let planning = false;
  let suppressMapClick = false;
  let fromSeq = 0;
  let toSeq = 0;

  function setStatus(text) { status.textContent = text; }

  function formatKm(meters) { return (Number(meters || 0) / 1000).toFixed(1) + ' km'; }
  function formatMinutes(seconds) { return Math.max(1, Math.round(Number(seconds || 0) / 60)) + ' 分钟'; }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g,
      ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function coordText(point) {
    return point ? Number(point.lon).toFixed(5) + ', ' + Number(point.lat).toFixed(5) : '';
  }

  function updatePointText() {
    fromInput.value = from ? (from.name || '') : '';
    toInput.value = to ? (to.name || '') : '';
    fromText.textContent = from ? coordText(from) : '未选择，可输入地名或点击地图';
    toText.textContent = to ? coordText(to) : '未选择，可输入地名或点击地图';
  }

  function hideSuggest(kind) {
    const box = kind === 'from' ? fromSuggest : toSuggest;
    box.classList.remove('show');
    box.innerHTML = '';
  }

  function setPoint(kind, point) {
    if (kind === 'from') {
      from = point;
      if (fromMarker) fromMarker.remove();
      fromMarker = addMarker(point, '#16a34a', '起点');
    } else {
      to = point;
      if (toMarker) toMarker.remove();
      toMarker = addMarker(point, '#dc2626', '终点');
    }
    updatePointText();
    hideSuggest(kind);
    map.flyTo({ center: [point.lon, point.lat], zoom: Math.max(map.getZoom(), 14) });
    if (from && to) plan();
  }

  async function runSearch(kind, text) {
    const box = kind === 'from' ? fromSuggest : toSuggest;
    const seq = kind === 'from' ? ++fromSeq : ++toSeq;
    box.classList.add('show');
    box.innerHTML = '<div class="suggest-empty">搜索中…</div>';
    try {
      const response = await fetch('/api/poi/search?keyword='
        + encodeURIComponent(text) + '&limit=8');
      const json = await response.json();
      const stale = kind === 'from' ? seq !== fromSeq : seq !== toSeq;
      if (stale) return;
      const seen = new Set();
      const items = (json.data || []).filter(item => {
        if (item.lon == null || item.lat == null) return false;
        if (seen.has(item.name)) return false;
        seen.add(item.name);
        return true;
      });
      if (!items.length) {
        box.innerHTML = '<div class="suggest-empty">没有找到匹配地点</div>';
        return;
      }
      box.innerHTML = '';
      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'suggest-item';
        row.innerHTML = `<b>${escapeHtml(item.name)}</b>`
          + `<span>${escapeHtml(item.category || '')} · `
          + `${Number(item.lon).toFixed(4)}, ${Number(item.lat).toFixed(4)}</span>`;
        row.addEventListener('click', () => setPoint(kind, {
          lon: Number(item.lon),
          lat: Number(item.lat),
          name: item.name
        }));
        box.appendChild(row);
      }
    } catch (e) {
      if (kind === 'from' ? seq === fromSeq : seq === toSeq) {
        box.innerHTML = '<div class="suggest-empty">搜索失败，请稍后重试</div>';
      }
    }
  }

  function bindPlaceInput(kind) {
    const input = kind === 'from' ? fromInput : toInput;
    const box = kind === 'from' ? fromSuggest : toSuggest;
    let timer = null;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      const text = input.value.trim();
      if (!text) { hideSuggest(kind); return; }
      timer = setTimeout(() => runSearch(kind, text), 220);
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        const first = box.querySelector('.suggest-item');
        if (first) first.click();
      } else if (event.key === 'Escape') {
        hideSuggest(kind);
      }
    });
    document.addEventListener('click', (event) => {
      if (event.target !== input && !box.contains(event.target)) hideSuggest(kind);
    });
  }

  bindPlaceInput('from');
  bindPlaceInput('to');

  function clearMarkers() {
    if (fromMarker) { fromMarker.remove(); fromMarker = null; }
    if (toMarker) { toMarker.remove(); toMarker = null; }
  }

  function addMarker(point, color, label) {
    const el = document.createElement('div');
    el.className = 'route-marker';
    el.innerHTML = `<i style="background:${color}"></i>${label} · ${point.name || ''}`;
    return new maplibregl.Marker({ element: el })
      .setLngLat([point.lon, point.lat])
      .addTo(map);
  }

  function clearRoutes() {
    for (const id of routeLayerIds) {
      if (map.getLayer(id + '-casing')) map.removeLayer(id + '-casing');
      if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);
    }
    routeLayerIds = [];
    currentRoutes = [];
    selectedIndex = -1;
    routeList.innerHTML = '';
    const summary = document.getElementById('route-summary');
    if (summary) {
      summary.classList.remove('show');
      summary.innerHTML = '';
    }
  }

  function colorFor(route, index) {
    const palette = COLORS[route.mode] || COLORS.car;
    return palette[index % palette.length];
  }

  function renderRoutes(routes) {
    clearRoutes();
    currentRoutes = routes;
    if (!routes.length) {
      setStatus('没有找到可用路线，请换一个起点或终点。');
      return;
    }

    const allCoords = [];
    routes.forEach((route, index) => {
      const sourceId = 'route-' + index;
      const color = colorFor(route, index);
      const feature = {
        type: 'Feature',
        geometry: route.geometry,
        properties: { label: route.label, mode: route.mode }
      };
      map.addSource(sourceId, { type: 'geojson', data: feature });
      map.addLayer({
        id: sourceId + '-casing',
        type: 'line',
        source: sourceId,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#ffffff', 'line-width': 12, 'line-opacity': 0.95 }
      });
      const linePaint = {
        'line-color': color,
        'line-width': 8,
        'line-opacity': 0.95
      };
      if (route.mode === 'walk') linePaint['line-dasharray'] = [2, 2];
      map.addLayer({
        id: sourceId,
        type: 'line',
        source: sourceId,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: linePaint
      });
      map.on('click', sourceId, () => {
        suppressMapClick = true;
        selectRoute(index);
        setTimeout(() => { suppressMapClick = false; }, 0);
      });
      map.on('mouseenter', sourceId, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', sourceId, () => { map.getCanvas().style.cursor = ''; });

      routeLayerIds.push(sourceId);
      for (const coord of (route.geometry.coordinates || [])) allCoords.push(coord);

      const card = document.createElement('div');
      card.className = 'route-card';
      card.dataset.index = String(index);
      card.addEventListener('click', () => selectRoute(index));
      const h = route.highlights || {};
      const roadTags = (h.roadTypes || []).slice(0, 3)
        .map(item => `<span class="tag">${item.label || item.type} ${Math.round((item.ratio || 0) * 100)}%</span>`)
        .join('');
      const poiTags = (h.pois || []).slice(0, 4)
        .map(item => `<span class="tag">${item.category} ${item.cnt}</span>`)
        .join('');
      const districtTags = (h.districts || [])
        .map(name => `<span class="tag">${name}</span>`)
        .join('');
      const fallbackTag = route.fallback
        ? `<span class="tag" style="background:#fef3c7;color:#92400e">${route.fallbackNote || '路网回退'}</span>`
        : '';
      const sourceTag = route.sourceLabel
        ? `<span class="tag" style="background:#dcfce7;color:#166534">${route.sourceLabel}</span>`
        : '';
      card.innerHTML = `
        <div class="route-head">
          <span class="route-dot" style="background:${color}"></span>
          <span class="route-title">${route.label}</span>
          <span class="route-mode">${route.mode === 'walk' ? '步行' : '驾车'}</span>
        </div>
        <div class="route-stats">${formatKm(route.distanceMeters)} · 约 ${formatMinutes(route.durationSeconds)}</div>
        <div class="tags">${roadTags}${poiTags}${districtTags}${fallbackTag}${sourceTag}</div>
        <div class="summary">${h.summary || ''}</div>
      `;
      routeList.appendChild(card);
    });

    if (from) allCoords.push([from.lon, from.lat]);
    if (to) allCoords.push([to.lon, to.lat]);

    const summary = document.getElementById('route-summary');
    if (summary) {
      const carCount = routes.filter(route => route.mode === 'car').length;
      const walkCount = routes.filter(route => route.mode === 'walk').length;
      summary.classList.add('show');
      summary.innerHTML = `<b>${from?.name || '起点'} → ${to?.name || '终点'}</b>`
        + `<span>${carCount} 条驾车 · ${walkCount} 条步行</span>`;
    }

    if (allCoords.length) {
      const bounds = new maplibregl.LngLatBounds(allCoords[0], allCoords[0]);
      for (const coord of allCoords) bounds.extend(coord);
      map.fitBounds(bounds, {
        padding: { top: 60, bottom: 60, left: 420, right: 60 },
        maxZoom: 15,
        duration: 700
      });
    }
    selectRoute(0);
  }

  function selectRoute(index) {
    selectedIndex = index;
    currentRoutes.forEach((route, i) => {
      const layerId = 'route-' + i;
      if (!map.getLayer(layerId)) return;
      map.setPaintProperty(layerId, 'line-width', i === index ? 10 : 6);
      map.setPaintProperty(layerId, 'line-opacity', i === index ? 0.98 : 0.55);
    });
    for (const card of routeList.querySelectorAll('.route-card')) {
      card.classList.toggle('active', Number(card.dataset.index) === index);
    }
  }

  async function plan() {
    if (planning) return;
    if (!from || !to) {
      setStatus('请输入地名定位，或在地图上选择起点和终点。');
      return;
    }
    const modes = [];
    if (document.getElementById('mode-car').checked) modes.push('car');
    if (document.getElementById('mode-walk').checked) modes.push('walk');
    if (!modes.length) {
      setStatus('至少选择一种出行方式。');
      return;
    }
    planning = true;
    planButton.disabled = true;
    setStatus('正在规划路线…');
    const started = performance.now();
    try {
      const response = await fetch('/api/route/plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          from,
          to,
          modes,
          alternatives: Number(document.getElementById('alternatives').value)
        })
      });
      const json = await response.json();
      if (!response.ok || json.code !== 0) throw new Error(json.message || '请求失败');
      const routes = json.data.routes || [];
      renderRoutes(routes);
      setStatus(`已生成 ${routes.length} 条路线（${Math.round(performance.now() - started)}ms）`);
    } catch (e) {
      setStatus('规划失败：' + e.message);
    } finally {
      planning = false;
      planButton.disabled = false;
    }
  }

  function reset() {
    from = null;
    to = null;
    clearMarkers();
    clearRoutes();
    hideSuggest('from');
    hideSuggest('to');
    updatePointText();
    setStatus('输入地名或在地图上点两下设置起点和终点。');
  }

  map.on('click', (event) => {
    if (suppressMapClick) return;
    const point = {
      lon: Number(event.lngLat.lng.toFixed(6)),
      lat: Number(event.lngLat.lat.toFixed(6)),
      name: '地图选点'
    };
    if (!from || (from && to)) {
      clearMarkers();
      clearRoutes();
      to = null;
      setPoint('from', point);
    } else {
      setPoint('to', point);
    }
  });

  planButton.addEventListener('click', plan);
  resetButton.addEventListener('click', reset);

  function initFromUrl() {
    const params = new URLSearchParams(location.search);
    if (params.get('fromLon') && params.get('fromLat')) {
      from = {
        lon: Number(params.get('fromLon')),
        lat: Number(params.get('fromLat')),
        name: params.get('fromName') || '起点'
      };
      fromMarker = addMarker(from, '#16a34a', '起点');
    }
    if (params.get('toLon') && params.get('toLat')) {
      to = {
        lon: Number(params.get('toLon')),
        lat: Number(params.get('toLat')),
        name: params.get('toName') || '终点'
      };
      toMarker = addMarker(to, '#dc2626', '终点');
    }
    updatePointText();
    if (from && to) {
      plan();
    }
  }

  // 立即读取 URL 参数并规划；addSource/addLayer 在 style 加载完成前也可用，
  // 不再依赖可能因瓦片失败而不触发的 load 事件。
  initFromUrl();
</script>
</body>
</html>
